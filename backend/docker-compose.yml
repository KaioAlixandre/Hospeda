services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-hospeda}
      MYSQL_USER: ${DATABASE_USER:-hospeda}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      PORT: 3333
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:-hospeda}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-hospeda}
      DATABASE_URL: mysql://${DATABASE_USER:-hospeda}:${DATABASE_PASSWORD}@db:3306/${DATABASE_NAME:-hospeda}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MESSAGING_API_URL: ${MESSAGING_API_URL:-http://host.docker.internal:3000}
      MESSAGING_INSTANCE_ID: ${MESSAGING_INSTANCE_ID:-}
      MESSAGING_TOKEN: ${MESSAGING_TOKEN:-}
      MESSAGING_CLIENT_TOKEN: ${MESSAGING_CLIENT_TOKEN:-}
      MESSAGING_STYLE: ${MESSAGING_STYLE:-z-api}
      MESSAGING_PROPERTY_NAME: ${MESSAGING_PROPERTY_NAME:-Hospeda}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEND_API_BASE_URL: ${SEND_API_BASE_URL:-https://api.kaioalixandre.com.br}
      SEND_API_EMAIL: ${SEND_API_EMAIL:-}
      SEND_API_PASSWORD: ${SEND_API_PASSWORD:-}
      SEND_API_ACCESS_TOKEN: ${SEND_API_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
